<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Bibliothèque</title>
<meta name="description" content="Catalogue de mes livres">
<meta name="theme-color" content="#7b5131">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bibliothèque">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3ebdf;--card:#fdf8f0;--ink:#2b2018;--muted:#7d6a58;--line:#e2d4c0;
  --accent:#7b5131;--accent-soft:#efe0cd;--chip:#ebdfcd;--ok:#4f7a3d;--warn:#a8741a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1b1510;--card:#261d16;--ink:#f2e8da;--muted:#ad9a86;--line:#3d3026;
  --accent:#b0814f;--accent-soft:#3b2b1e;--chip:#33271d;--ok:#8fbf73;--warn:#e0b05b;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:24px;margin:0 0 2px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.search{display:flex;gap:8px}
.search input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;outline:none}
.search input:focus{border-color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 12px;border-radius:999px;background:var(--chip);border:0;color:var(--ink);font:500 13px Inter,sans-serif;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
main{padding:12px 16px 100px;max-width:760px;margin:0 auto}
.filterbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.active-filter{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;border:0;cursor:pointer}
.group-list{display:flex;flex-direction:column;gap:6px}
.group{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.group b{font-weight:600}
.count{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted);font-weight:600}
.book{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;color:var(--ink);font:inherit}
.spine{flex:none;width:8px;border-radius:4px}
.book .t{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:16.5px;line-height:1.25}
.book .a{color:var(--muted);font-size:13.5px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tag.age{background:var(--accent-soft);color:var(--accent)}
.tag.v{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
.sorter{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:13px}
.sorter select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom));z-index:11;transform:translateY(100%);transition:transform .25s ease;max-width:760px;margin:0 auto}
.sheet.open{transform:none}
.sheet h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:4px 0 4px;line-height:1.2}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
dl{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;margin:14px 0}
dt{color:var(--muted);font-size:13px}
dd{margin:0}
dd a{color:var(--accent);text-decoration:none;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer;min-width:120px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--accent)}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.f{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea.f{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:Fraunces,serif;font-size:22px}
.stat span{font-size:11.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
.toast.show{opacity:1}
.sync{font-size:11.5px;color:var(--muted)}
.bgimg{position:fixed;inset:0;z-index:-2;background:url(fond.jpg) center/cover no-repeat}
.bgveil{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(243,235,223,.35),rgba(243,235,223,.15))}
@media (prefers-color-scheme:dark){.bgveil{background:linear-gradient(180deg,rgba(27,21,16,.6),rgba(27,21,16,.45))}}
html,body{background:transparent!important}
html{background:var(--bg)!important}
header{background:color-mix(in srgb,var(--bg) 82%,transparent)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.book,.group,.stat{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sorter,.filterbar,main>h3,main>.sub,.empty{background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:10px;padding:6px 10px}
.types{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}.types::-webkit-scrollbar{display:none}.types button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 12.5px Inter,sans-serif;cursor:pointer}.types button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--chip);border-radius:12px;padding:4px;margin-top:10px}
.seg button{border:0;background:transparent;color:var(--ink);font:600 12px Inter,sans-serif;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tag.lieu{background:transparent;border:1px solid var(--line)}

/* ---- étagère ---- */
.vbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:600 13px Inter,sans-serif;cursor:pointer}
.case{background:linear-gradient(90deg,#4a2a12,#6b3f1f 3%,#8a5530 50%,#6b3f1f 97%,#4a2a12);padding:10px 10px 0;border-radius:6px;box-shadow:0 14px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.4)}
.shelf{position:relative;height:150px;display:flex;align-items:flex-end;padding:0 8px;gap:1px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.25) 30%,rgba(0,0,0,.35)),repeating-linear-gradient(90deg,#3d2311 0 7px,#432713 7px 15px,#3a210f 15px 19px);box-shadow:inset 0 10px 18px rgba(0,0,0,.6),inset 6px 0 10px rgba(0,0,0,.5),inset -6px 0 10px rgba(0,0,0,.5)}
.plank{height:16px;margin:0 -10px 10px;background:linear-gradient(#a8703f,#8a5530 30%,#6b3f1f 80%,#4a2a12);box-shadow:0 6px 10px rgba(0,0,0,.5)}
.bk{position:relative;flex:none;width:var(--w);height:var(--h);border:0;padding:0;cursor:pointer;border-radius:2px 2px 1px 1px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.12) 18%,rgba(255,255,255,.04) 45%,rgba(0,0,0,.18) 80%,rgba(0,0,0,.5)),var(--c);box-shadow:2px 0 3px rgba(0,0,0,.45);transition:transform .25s ease,box-shadow .25s;transform-origin:bottom center}
.bk::before,.bk::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--gold);opacity:.85}
.bk::before{top:9%;box-shadow:0 5px 0 var(--gold)}.bk::after{bottom:7%;box-shadow:0 -5px 0 var(--gold)}
.bk.plain::before,.bk.plain::after{display:none}
.bk span{position:absolute;inset:22% 0 20%;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;font-size:var(--fs,11px);color:var(--tx);text-shadow:0 1px 1px rgba(0,0,0,.6);line-height:1.05;overflow:hidden;padding:0 2px;white-space:nowrap;letter-spacing:.3px}
.bk i{position:absolute;bottom:2%;left:0;right:0;text-align:center;font:700 9px system-ui;font-style:normal;color:var(--tx)}
.bk.lean{transform:rotate(-9deg) translateX(4px);margin-left:6px}
.bk.out{transform:translateY(-16px);box-shadow:0 10px 16px rgba(0,0,0,.6);z-index:2}.bk.lean.out{transform:translateY(-16px)}
.bk.st{filter:saturate(.55) brightness(.85)}
.ov{position:fixed;inset:0;z-index:12;background:rgba(10,6,3,.6);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;perspective:1200px}
.ov.open{opacity:1;pointer-events:auto}
.book3d{position:relative;width:min(84vw,340px);height:min(128vw,500px);transform-style:preserve-3d;transform:rotateY(-25deg) scale(.6);transition:transform .5s ease}
.ov.open .book3d{transform:none}
.pages{position:absolute;inset:6px 4px 6px 10px;background:repeating-linear-gradient(#fbf3e4 0 3px,#efe2c9 3px 4px);border-radius:3px 10px 10px 3px;color:#2b2018;padding:18px 16px 16px 20px;font-size:14px;overflow:auto;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.pages h2{font-family:Fraunces,Georgia,serif;margin:6px 0 2px;font-size:21px;line-height:1.2}
.pages dl{grid-template-columns:96px 1fr}.pages .btn{min-width:0}
.cover{position:absolute;inset:0;border-radius:4px 12px 12px 4px;transform-origin:left center;transition:transform .7s cubic-bezier(.6,.05,.3,1) .35s;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.08) 6%,transparent 12%),var(--c);box-shadow:0 18px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--tx);backface-visibility:hidden;pointer-events:none}
.cover b{font-family:Georgia,serif;font-size:24px;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);padding:12px 4px}
.cover small{margin-top:10px;font-size:14px}
.ov.reveal .cover{transform:rotateY(-160deg)}
</style>
</head>

  const authors=Object.keys(count("auteur")).length, eds=Object.keys(count("editeur")).length;
  const titles={};all.forEach(b=>{const t=norm(b.titre);titles[t]=(titles[t]||[]).concat(b)});
  const dups=Object.values(titles).filter(a=>a.length>1);
  const verif=all.filter(b=>/vérifier/i.test(b.note||"")||b.auteur==="À vérifier");
  const bar=(o,order)=>{const keys=order?order.filter(k=>o[k]):Object.keys(o).sort((a,b)=>o[b]-o[a]);const max=Math.max(...Object.values(o));
    return keys.map(k=>`<button class="group" data-k="${order?"age":"genre"}" data-v="${esc(k)}" style="flex-direction:column;align-items:stretch;gap:6px"><span style="display:flex;justify-content:space-between"><b>${esc(k)}</b><span class="count">${o[k]}</span></span><span style="height:6px;border-radius:3px;background:var(--chip)"><span style="display:block;height:6px;border-radius:3px;width:${o[k]/max*100}%;background:${order?"var(--accent)":colorFor(k)}"></span></span></button>`).join("")};
  return `<div class="stats"><div class="stat"><b>${all.length}</b><span>livres</span></div><div class="stat"><b>${authors}</b><span>auteurs</span></div><div class="stat"><b>${eds}</b><span>éditeurs</span></div></div>
  <h3 style="font-family:Fraunces,serif;margin:16px 0 8px">Par emplacement</h3><div class="group-list">${LIEUX.map(l=>`<button class="group" data-lieu="${l}"><b>${l==="Stockage"?"📦":"📚"} ${l}</b><span class="count">${books().filter(b=>b.lieu===l).length}</span></button>`).join("")}</div>
  ${(()=>{const orig=new Map(ALL.map(x=>[x.id,x.lieu])),mv=books().filter(x=>orig.has(x.id)&&orig.get(x.id)!==x.lieu).sort((x,y)=>(y.m||0)-(x.m||0));
   return `<h3 style="font-family:Fraunces,serif;margin:18px 0 8px">Changés de place (${mv.length})</h3>`+(mv.length?`<div class="sub">Livres qui ne sont plus dans leur section d'origine. Touche-en un pour le remettre en place.</div>`+mv.map(x=>bookCard(x).replace('<div class="tags">',`<div class="tags"><span class="tag lieu">${x.lieu==="Stockage"?"📦 au stockage":"📚 en bibliothèque"}</span>`)).join(""):`<div class="sub">Aucun livre déplacé.</div>`)})()}
  <h3 style="font-family:Fraunces,serif;margin:16px 0 8px">Par âge</h3><div class="group-list">${bar(count("age"),AGE_ORDER)}</div>
  <h3 style="font-family:Fraunces,serif;margin:18px 0 8px">Par genre</h3><div class="group-list">${bar(count("genre"))}</div>
  <h3 style="font-family:Fraunces,serif;margin:18px 0 8px">Titres en plusieurs exemplaires (${dups.length})</h3>${dups.map(a=>`<div class="sub">• ${esc(a[0].titre)} — ${a.length}× (${a.map(b=>esc(b.editeur)).join(", ")})</div>`).join("")}
  <h3 style="font-family:Fraunces,serif;margin:18px 0 8px">À vérifier (${verif.length})</h3>${verif.map(bookCard).join("")}
  <h3 style="font-family:Fraunces,serif;margin:18px 0 8px">Sauvegarde</h3>
  <div class="sub">Tes modifications sont enregistrées sur ce téléphone. Pense à copier la liste de temps en temps pour la garder en lieu sûr.</div>
  <div class="row"><button class="btn" id="exp">Copier la liste (JSON)</button><button class="btn" id="imp">Importer</button></div>
  <div class="row"><button class="btn" id="csv">Copier pour Excel (CSV)</button></div>`;
}

// ---- sheet
const sheet=document.getElementById("sheet"),bg=document.getElementById("bg");
// ---- historique : le bouton retour du téléphone revient en arrière au lieu de quitter
let sheetOpen=false;
const snap=(sh)=>({dim:state.dim,filter:state.filter,lieu:state.lieu,type:state.type,sheet:!!sh});
function nav(replace){try{history[replace?"replaceState":"pushState"](snap(false),"")}catch(e){}}
function openSheet(html){if(typeof hideBook==="function")hideBook();sheet.innerHTML=`<div class="grab"></div>`+html;bg.style.display="block";requestAnimationFrame(()=>sheet.classList.add("open"));
  if(!sheetOpen){sheetOpen=true;try{history.pushState(snap(true),"")}catch(e){}}}
function hideSheet(){sheetOpen=false;if(typeof hideBook==="function")hideBook();sheet.classList.remove("open");setTimeout(()=>{if(!sheetOpen)bg.style.display="none"},250)}
function closeSheet(){if(sheetOpen&&history.state&&history.state.sheet){history.back()}else hideSheet()}
window.addEventListener("popstate",e=>{const s=e.state;hideSheet();if(!s)return;
  const changed=s.dim!==state.dim||JSON.stringify(s.filter)!==JSON.stringify(state.filter)||s.lieu!==state.lieu||(s.type||"Tous")!==state.type;
  state.type=s.type||"Tous";state.dim=s.dim;state.filter=s.filter;state.lieu=s.lieu;if(changed){render();window.scrollTo(0,0)}});
bg.onclick=closeSheet;
function detail(id){
  const b=books().find(x=>x.id===id);if(!b)return;
  const link=(k)=>b[k]?`<a href="#" data-k="${k}" data-v="${esc(b[k])}">${esc(b[k])}</a>`:"—";
  const body=`<div class="tags"><span class="tag" style="background:${colorFor(b.genre)};color:#fff">${esc(b.genre)}</span><span class="tag age">${esc(b.age)}</span></div>
  <h2>${esc(b.titre)}</h2><div class="sub">${esc(b.auteur)}</div>
  <dl><dt>Auteur</dt><dd>${link("auteur")}</dd><dt>Éditeur</dt><dd>${link("editeur")}</dd><dt>Collection</dt><dd>${link("collection")}</dd>
  <dt>Emplacement</dt><dd>${b.lieu==="Stockage"?"📦":"📚"} ${esc(b.lieu)}</dd><dt>Genre</dt><dd>${link("genre")}</dd><dt>Âge conseillé</dt><dd>${link("age")}</dd>${b.note?`<dt>Note</dt><dd>${esc(b.note)}</dd>`:""}${b.photo?`<dt>Photo</dt><dd>n° ${esc(b.photo)}</dd>`:""}</dl>
  <div class="row"><button class="btn primary" data-edit="${b.id}">Modifier</button><button class="btn danger" data-del="${b.id}">Supprimer</button></div>
  <div class="row"><button class="btn" data-move="${b.id}">Déplacer vers ${b.lieu==="Stockage"?"📚 la bibliothèque":"📦 le stockage"}</button></div>`;
  const sp=document.querySelector(`.bk[data-id="${b.id}"]`);
  if(shelfMode&&sp){document.querySelectorAll(".bk.out").forEach(x=>x.classList.remove("out"));sp.classList.add("out");setTimeout(()=>openBook(b,body),260)}
  else openSheet(body);
}

// ---- vue étagère ----
let shelfMode=true;try{shelfMode=localStorage.getItem("biblio_vue")!=="liste"}catch(e){}
const PAL={"Policier / Thriller":["#5a1e1e","#6e2a24","#3b1a1a","#702f2f","#4a2323"],"Science-fiction / Fantastique":["#1e2f4a","#22384f","#2d2346","#1b3a3a","#3a2a52"],
"Roman":["#2f4a2a","#4a3a22","#5a4026","#3a4a3a","#5b3a2e"],"Roman historique":["#5b3a1e","#4a3018"],"Manga":["#c8622a","#1f6e8c","#3a8a7a","#222222","#d0a020","#b03a48","#e2e2e2"],
"BD":["#e9e2cf","#d9cfb8"],"Album jeunesse":["#e07a3a","#3a9ad0","#d04a7a","#6aa02a","#e0b020","#7a5ad0"],"Littérature jeunesse":["#8a3a6a","#2a6a8a","#a05a2a"],
"Romance":["#d06a8a","#8a4ab0","#2a9ab0","#e08a3a"],"Récit / Témoignage":["#4a4a3a","#5a4a3a"],"Essai / Sciences humaines":["#2a3a4a","#4a2a2a"],"Théâtre":["#6a2a3a","#3a2a5a","#2a4a5a"],"Poésie":["#4a2a5a","#2a5a4a"]};
const hsh=s=>{let h=0;for(const c of s||"")h=(h*31+c.charCodeAt(0))>>>0;return h};
const isLight=c=>{const n=parseInt(c.slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>165};
function look(b){const k=hsh(b.titre+b.auteur+b.id),p=PAL[b.genre]||["#5a3a2a","#3a2a4a","#2a4a3a","#4a2a2a","#2a3a4a"],c=p[k%p.length],L=isLight(c),manga=b.genre==="Manga",kid=b.genre==="Album jeunesse"||b.genre==="BD";
 const tomes=manga?(((b.note||"").match(/(\d+)\s*à\s*(\d+)/)||[])[2]|0):0;
 return {c,tx:L?"#2b2018":(manga||kid?"#fff":"#e9cf8f"),gold:L?"#7b5131":(manga||kid?"rgba(255,255,255,.7)":"#c9a45a"),
  w:manga?Math.min(90,18+Math.max(1,tomes)*1.6):kid?19+k%6:21+k%17,h:manga?84:kid?(66+k%10):(74+k%19),plain:manga||kid,fs:manga?"10px":"11px",tomes}}
function shelfHTML(list){const mn=document.getElementById("main"),cs=getComputedStyle(mn);
 const W=Math.max(180,(mn.clientWidth||360)-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-36-8);let rows=[],row=[],w=0;
 for(const b of list){const bw=look(b).w+1;if(w+bw>W&&row.length){rows.push(row);row=[];w=0}row.push(b);w+=bw}if(row.length)rows.push(row);
 return `<div class="case">${rows.map(r=>`<div class="shelf">${r.map((b,k)=>{const L=look(b),lean=k===r.length-1&&r.length>3&&hsh(b.titre)%3===0&&r.reduce((s,x)=>s+look(x).w+1,0)+14<=W;
  return `<button class="bk${L.plain?" plain":""}${lean?" lean":""}${state.lieu==="Tout"&&b.lieu==="Stockage"?" st":""}" data-id="${b.id}" aria-label="${esc(b.titre)}" style="--c:${L.c};--tx:${L.tx};--gold:${L.gold};--w:${L.w}px;--h:${L.h}%;--fs:${L.fs}"><span>${esc(b.titre)}</span>${L.tomes?`<i>×${L.tomes}</i>`:""}</button>`}).join("")}</div><div class="plank"></div>`).join("")}</div>`}
const ov=document.getElementById("ov");
function hideBook(){ov.classList.remove("reveal");ov.classList.remove("open");document.querySelectorAll(".bk.out").forEach(x=>x.classList.remove("out"))}
function openBook(b,inner){const L=look(b),cv=document.getElementById("cv");cv.style.cssText=`--c:${L.c};--tx:${L.tx};--gold:${L.gold}`;cv.innerHTML=`<b>${esc(b.titre)}</b><small>${esc(b.auteur)}</small>`;
 document.getElementById("pg").innerHTML=inner;document.getElementById("pg").scrollTop=0;ov.classList.remove("reveal");ov.classList.add("open");requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add("reveal")));
 if(!sheetOpen){sheetOpen=true;try{history.pushState(snap(true),"")}catch(e){}}}
ov.addEventListener("click",e=>{if(e.target===ov)closeSheet()});
let rzt;addEventListener("resize",()=>{clearTimeout(rzt);rzt=setTimeout(()=>{if(shelfMode)render()},200)});
function datalist(k){return `<datalist id="dl-${k}">${[...new Set(books().map(b=>b[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr")).map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`}
function editForm(id){
  const b=id?books().find(x=>x.id===id):{titre:"",auteur:"",editeur:"",collection:"",genre:"",age:"",note:"",lieu:state.lieu==="Stockage"?"Stockage":"Bibliothèque"};
  const fld=(k,dl)=>`<label>${LABEL[k]}</label><input class="f" name="${k}" value="${esc(b[k])}" ${dl?`list="dl-${k}"`:""}>${dl?datalist(k):""}`;
  openSheet(`<h2>${id?"Modifier":"Ajouter un livre"}</h2><form id="ef">${fld("titre")}${fld("auteur",1)}${fld("editeur",1)}${fld("collection",1)}${fld("genre",1)}
  <label>Âge conseillé</label><select class="f" name="age">${AGE_ORDER.map(a=>`<option ${b.age===a?"selected":""}>${a}</option>`).join("")}</select>
  <label>Emplacement</label><select class="f" name="lieu">${LIEUX.map(l=>`<option ${b.lieu===l?"selected":""}>${l}</option>`).join("")}</select>${fld("note")}
  <div class="row"><button type="button" class="btn" id="cancel">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`);
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("ef").onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));
    if(!fd.titre.trim()){toast("Le titre est obligatoire");return}
    const nid=id||("u"+Date.now().toString(36));saveOverride(nid,{...fd,photo:b.photo||""});closeSheet();toast(id?"Modifié":"Livre ajouté");};
}
function confirmDel(id){
  const b=books().find(x=>x.id===id);
  openSheet(`<h2>Supprimer ?</h2><div class="sub">« ${esc(b.titre)} » sera retiré de ta bibliothèque.</div><div class="row"><button class="btn" id="cancel">Annuler</button><button class="btn primary" id="okdel">Supprimer</button></div>`);
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("okdel").onclick=()=>{saveOverride(id,{deleted:true});closeSheet();toast("Supprimé")};
}

// ---- persistence (stockage sur le téléphone)
function saveOverride(id,data){overrides[id]=data;lsSet();render()}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

// ---- export / import
async function copy(text,msg){try{await navigator.clipboard.writeText(text);toast(msg)}catch(e){openSheet(`<h2>Copie manuelle</h2><textarea class="f">${esc(text)}</textarea>`)}}
function exportJSON(){copy(JSON.stringify(books(),null,1),"Liste copiée (JSON)")}
function exportCSV(){const ks=["titre","auteur","editeur","collection","genre","age","lieu","note"];
  const rows=[ks.map(k=>LABEL[k]).join(";")].concat(books().map(b=>ks.map(k=>`"${(b[k]||"").toString().replace(/"/g,'""')}"`).join(";")));copy(rows.join("\n"),"Copié – colle dans Excel")}
function importForm(){openSheet(`<h2>Importer</h2><div class="sub">Colle une liste JSON exportée depuis cette appli (ou depuis la version Claude). Les livres existants (même identifiant) seront mis à jour. Une ancienne liste (avant la section Bibliothèque) ne touche pas aux nouveaux livres.</div><textarea class="f" id="impt"></textarea><div class="row"><button class="btn" id="cancel">Annuler</button><button class="btn primary" id="doimp">Importer</button></div>`);
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("doimp").onclick=()=>{try{const arr=JSON.parse(document.getElementById("impt").value);if(!Array.isArray(arr))throw 0;
    const next={},seen=new Set();let n=0;
    for(const b of arr){if(!b||!b.titre)continue;const id=b.id||("u"+Date.now().toString(36)+n);const {id:_,...rest}=b;next[id]=rest;seen.add(id);n++}
    const pre=new Set([...seen].map(i=>i[0]));
    for(const b of ALL) if(pre.has(b.id[0])&&!seen.has(b.id)) next[b.id]={deleted:true};
    overrides=next;lsSet();render();closeSheet();toast(n+" livres importés")}catch(e){toast("JSON invalide")}}}

let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2000)}

// ---- events
document.addEventListener("click",e=>{
  if(e.target.closest("#vue")){shelfMode=!shelfMode;try{localStorage.setItem("biblio_vue",shelfMode?"etagere":"liste")}catch(x){}render();return}
  const t=e.target.closest("[data-type],[data-lieu],[data-move],[data-dim],[data-k],[data-id],[data-edit],[data-del],#clearf,#exp,#imp,#csv");if(!t)return;
  if(t.dataset.type){state.type=t.dataset.type;state.filter=null;if(state.dim==="stats")state.dim="all";try{localStorage.setItem("biblio_type",state.type)}catch(e){}render();window.scrollTo(0,0);nav();return}
  if(t.dataset.lieu){state.lieu=t.dataset.lieu;state.filter=null;if(state.dim==="stats")state.dim="all";try{localStorage.setItem("biblio_lieu",state.lieu)}catch(e){}render();window.scrollTo(0,0);nav();return}
  if(t.dataset.move){const b=books().find(x=>x.id===t.dataset.move);const to=b.lieu==="Stockage"?"Bibliothèque":"Stockage";const {id:_,...rest}=b;saveOverride(b.id,{...rest,lieu:to,m:Date.now()});closeSheet();toast("Déplacé vers "+to.toLowerCase());return}
  if(t.dataset.dim){state.dim=t.dataset.dim;state.filter=null;render();window.scrollTo(0,0);nav()}
  else if(t.dataset.k){e.preventDefault();const fromSheet=sheetOpen;if(fromSheet)hideSheet();state.filter={k:t.dataset.k,v:t.dataset.v};state.q="";document.getElementById("q").value="";render();window.scrollTo(0,0);nav(fromSheet)}
  else if(t.dataset.id)detail(t.dataset.id);
  else if(t.dataset.edit)editForm(t.dataset.edit);
  else if(t.dataset.del)confirmDel(t.dataset.del);
  else if(t.id==="clearf"){state.filter=null;render();nav()}
  else if(t.id==="exp")exportJSON();else if(t.id==="imp")importForm();else if(t.id==="csv")exportCSV();
});
document.addEventListener("change",e=>{if(e.target.id==="sort"){state.sort=e.target.value;render()}});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render()});
document.getElementById("add").onclick=()=>editForm(null);
render();
try{history.replaceState(snap(false),"")}catch(e){}

// ---- PWA : fonctionnement hors ligne
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
