<html lang="fr">

<meta name="theme-color" content="#b4462f">

<style>
:root{
  --bg:#f6f1e7;--card:#fffdf8;--ink:#2a2420;--muted:#7a6f63;--line:#e6dccb;
  --accent:#b4462f;--accent-soft:#f4e1d9;--chip:#efe6d6;--ok:#3d7a55;--warn:#b7791f;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1916;--card:#26221e;--ink:#f1e9dc;--muted:#a89c8c;--line:#3a342d;
  --accent:#e0775c;--accent-soft:#3d2a23;--chip:#332d27;--ok:#7fc29a;--warn:#e3b05b;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:24px;margin:0 0 2px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.search{display:flex;gap:8px}
.search input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;outline:none}
.search input:focus{border-color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 12px;border-radius:999px;background:var(--chip);border:0;color:var(--ink);font:500 13px Inter,sans-serif;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
main{padding:12px 16px 100px;max-width:760px;margin:0 auto}
.filterbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.active-filter{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;border:0;cursor:pointer}
.group-list{display:flex;flex-direction:column;gap:6px}
.group{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.group b{font-weight:600}
.count{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted);font-weight:600}
.book{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;color:var(--ink);font:inherit}
.spine{flex:none;width:8px;border-radius:4px}
.book .t{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:16.5px;line-height:1.25}
.book .a{color:var(--muted);font-size:13.5px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tag.age{background:var(--accent-soft);color:var(--accent)}
.tag.v{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
.sorter{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:13px}
.sorter select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom));z-index:11;transform:translateY(100%);transition:transform .25s ease;max-width:760px;margin:0 auto}
.sheet.open{transform:none}
.sheet h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:4px 0 4px;line-height:1.2}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
dl{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;margin:14px 0}
dt{color:var(--muted);font-size:13px}
dd{margin:0}
dd a{color:var(--accent);text-decoration:none;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer;min-width:120px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--accent)}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.f{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea.f{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:Fraunces,serif;font-size:22px}
.stat span{font-size:11.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
.toast.show{opacity:1}
.sync{font-size:11.5px;color:var(--muted)}
</style>
</head>

    if(state.filter && (b[state.filter.k]||"—")!==state.filter.v) return false;
    if(!q) return true;
    return norm([b.titre,b.auteur,b.editeur,b.collection,b.genre,b.age,b.note].join(" ")).includes(q);
  });
}
function sortBooks(list){
  const k=state.sort;
  return list.sort((a,b)=>{
    if(k==="age") return AGE_ORDER.indexOf(a.age)-AGE_ORDER.indexOf(b.age)||a.titre.localeCompare(b.titre,"fr");
    return (a[k]||"").localeCompare(b[k]||"","fr")||a.titre.localeCompare(b.titre,"fr");
  });
}

function renderTabs(){
  document.getElementById("tabs").innerHTML=DIMS.map(([k,l])=>`<button class="tab ${state.dim===k&&!state.filter?"on":""}" data-dim="${k}">${l}</button>`).join("");
}
function bookCard(b){
  const v=/vérifier/i.test(b.note||"")||b.auteur==="À vérifier";
  return `<button class="book" data-id="${b.id}"><span class="spine" style="background:${colorFor(b.genre)}"></span><span style="flex:1;min-width:0">
  <div class="t">${esc(b.titre)}</div><div class="a">${esc(b.auteur)} · ${esc(b.editeur)}</div>
  <div class="tags"><span class="tag">${esc(b.genre)}</span><span class="tag age">${esc(b.age)}</span>${b.collection?`<span class="tag">${esc(b.collection)}</span>`:""}${v?`<span class="tag v">à vérifier</span>`:""}</div></span></button>`;
}
function render(){
  renderTabs();
  const all=books();
  document.getElementById("total").textContent=all.length+" livres";
  const m=document.getElementById("main");
  let html="";
  if(state.filter){
    html+=`<div class="filterbar"><button class="active-filter" id="clearf">${esc(LABEL[state.filter.k]||state.filter.k)} : ${esc(state.filter.v)} ✕</button></div>`;
  }
  if(state.dim==="stats"&&!state.filter&&!state.q){ m.innerHTML=statsView(all); return; }
  if(state.dim!=="all"&&!state.filter&&!state.q){
    const k=state.dim,groups={};
    for(const b of all){const g=b[k]||"—";groups[g]=(groups[g]||0)+1}
    let keys=Object.keys(groups);
    if(k==="age") keys.sort((a,b)=>AGE_ORDER.indexOf(a)-AGE_ORDER.indexOf(b));
    else keys.sort((a,b)=>groups[b]-groups[a]||a.localeCompare(b,"fr"));
    html+=`<div class="sorter">${keys.length} ${esc(DIMS.find(d=>d[0]===k)[1].toLowerCase())}s</div><div class="group-list">`+
      keys.map(g=>`<button class="group" data-k="${k}" data-v="${esc(g)}"><b>${esc(g)}</b><span class="count">${groups[g]}</span></button>`).join("")+`</div>`;
    m.innerHTML=html;return;
  }
  const list=sortBooks(filtered());
  html+=`<div class="sorter"><span>${list.length} résultat${list.length>1?"s":""}</span><label style="margin:0">Trier : <select id="sort">
  ${[["titre","Titre"],["auteur","Auteur"],["editeur","Éditeur"],["genre","Genre"],["age","Âge"]].map(([v,l])=>`<option value="${v}" ${state.sort===v?"selected":""}>${l}</option>`).join("")}</select></label></div>`;
  html+=list.length?list.map(bookCard).join(""):`<div class="empty">Aucun livre trouvé.</div>`;
  m.innerHTML=html;
}
function statsView(all){
  const count=k=>{const o={};all.forEach(b=>o[b[k]]=(o[b[k]]||0)+1);return o};
  const authors=Object.keys(count("auteur")).length, eds=Object.keys(count("editeur")).length;
  const titles={};all.forEach(b=>{const t=norm(b.titre);titles[t]=(titles[t]||[]).concat(b)});
  const dups=Object.values(titles).filter(a=>a.length>1);
  const verif=all.filter(b=>/vérifier/i.test(b.note||"")||b.auteur==="À vérifier");
  const bar=(o,order)=>{const keys=order?order.filter(k=>o[k]):Object.keys(o).sort((a,b)=>o[b]-o[a]);const max=Math.max(...Object.values(o));
    return keys.map(k=>`<button class="group" data-k="${order?"age":"genre"}" data-v="${esc(k)}" style="flex-direction:column;align-items:stretch;gap:6px"><span style="display:flex;justify-content:space-between"><b>${esc(k)}</b><span class="count">${o[k]}</span></span><span style="height:6px;border-radius:3px;background:var(--chip)"><span style="display:block;height:6px;border-radius:3px;width:${o[k]/max*100}%;background:${order?"var(--accent)":colorFor(k)}"></span></span></button>`).join("")};
  return `<div class="stats"><div class="stat"><b>${all.length}</b><span>livres</span></div><div class="stat"><b>${authors}</b><span>auteurs</span></div><div class="stat"><b>${eds}</b><span>éditeurs</span></div></div>
  <h3 style="font-family:Fraunces,serif;margin:16px 0 8px">Par âge</h3><div class="group-list">${bar(count("age"),AGE_ORDER)}</div>
  <h3 style="font-family:Fraunces,serif;margin:18px 0 8px">Par genre</h3><div class="group-list">${bar(count("genre"))}</div>
  <h3 style="font-family:Fraunces,serif;margin:18px 0 8px">Titres en plusieurs exemplaires (${dups.length})</h3>${dups.map(a=>`<div class="sub">• ${esc(a[0].titre)} — ${a.length}× (${a.map(b=>esc(b.editeur)).join(", ")})</div>`).join("")}
  <h3 style="font-family:Fraunces,serif;margin:18px 0 8px">À vérifier (${verif.length})</h3>${verif.map(bookCard).join("")}
  <h3 style="font-family:Fraunces,serif;margin:18px 0 8px">Sauvegarde</h3>
  <div class="sub">Tes modifications sont enregistrées sur ce téléphone. Pense à copier la liste de temps en temps pour la garder en lieu sûr.</div>
  <div class="row"><button class="btn" id="exp">Copier la liste (JSON)</button><button class="btn" id="imp">Importer</button></div>
  <div class="row"><button class="btn" id="csv">Copier pour Excel (CSV)</button></div>`;
}

// ---- sheet
const sheet=document.getElementById("sheet"),bg=document.getElementById("bg");
function openSheet(html){sheet.innerHTML=`<div class="grab"></div>`+html;bg.style.display="block";requestAnimationFrame(()=>sheet.classList.add("open"))}
function closeSheet(){sheet.classList.remove("open");setTimeout(()=>{bg.style.display="none"},250)}
bg.onclick=closeSheet;
function detail(id){
  const b=books().find(x=>x.id===id);if(!b)return;
  const link=(k)=>b[k]?`<a href="#" data-k="${k}" data-v="${esc(b[k])}">${esc(b[k])}</a>`:"—";
  openSheet(`<div class="tags"><span class="tag" style="background:${colorFor(b.genre)};color:#fff">${esc(b.genre)}</span><span class="tag age">${esc(b.age)}</span></div>
  <h2>${esc(b.titre)}</h2><div class="sub">${esc(b.auteur)}</div>
  <dl><dt>Auteur</dt><dd>${link("auteur")}</dd><dt>Éditeur</dt><dd>${link("editeur")}</dd><dt>Collection</dt><dd>${link("collection")}</dd>
  <dt>Genre</dt><dd>${link("genre")}</dd><dt>Âge conseillé</dt><dd>${link("age")}</dd>${b.note?`<dt>Note</dt><dd>${esc(b.note)}</dd>`:""}${b.photo?`<dt>Photo</dt><dd>n° ${esc(b.photo)}</dd>`:""}</dl>
  <div class="row"><button class="btn primary" data-edit="${b.id}">Modifier</button><button class="btn danger" data-del="${b.id}">Supprimer</button></div>`);
}
function datalist(k){return `<datalist id="dl-${k}">${[...new Set(books().map(b=>b[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr")).map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`}
function editForm(id){
  const b=id?books().find(x=>x.id===id):{titre:"",auteur:"",editeur:"",collection:"",genre:"",age:"",note:""};
  const fld=(k,dl)=>`<label>${LABEL[k]}</label><input class="f" name="${k}" value="${esc(b[k])}" ${dl?`list="dl-${k}"`:""}>${dl?datalist(k):""}`;
  openSheet(`<h2>${id?"Modifier":"Ajouter un livre"}</h2><form id="ef">${fld("titre")}${fld("auteur",1)}${fld("editeur",1)}${fld("collection",1)}${fld("genre",1)}
  <label>Âge conseillé</label><select class="f" name="age">${AGE_ORDER.map(a=>`<option ${b.age===a?"selected":""}>${a}</option>`).join("")}</select>${fld("note")}
  <div class="row"><button type="button" class="btn" id="cancel">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`);
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("ef").onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));
    if(!fd.titre.trim()){toast("Le titre est obligatoire");return}
    const nid=id||("u"+Date.now().toString(36));saveOverride(nid,{...fd,photo:b.photo||""});closeSheet();toast(id?"Modifié":"Livre ajouté");};
}
function confirmDel(id){
  const b=books().find(x=>x.id===id);
  openSheet(`<h2>Supprimer ?</h2><div class="sub">« ${esc(b.titre)} » sera retiré de ta bibliothèque.</div><div class="row"><button class="btn" id="cancel">Annuler</button><button class="btn primary" id="okdel">Supprimer</button></div>`);
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("okdel").onclick=()=>{saveOverride(id,{deleted:true});closeSheet();toast("Supprimé")};
}

// ---- persistence (stockage sur le téléphone)
function saveOverride(id,data){overrides[id]=data;lsSet();render()}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

// ---- export / import
async function copy(text,msg){try{await navigator.clipboard.writeText(text);toast(msg)}catch(e){openSheet(`<h2>Copie manuelle</h2><textarea class="f">${esc(text)}</textarea>`)}}
function exportJSON(){copy(JSON.stringify(books(),null,1),"Liste copiée (JSON)")}
function exportCSV(){const ks=["titre","auteur","editeur","collection","genre","age","note"];
  const rows=[ks.map(k=>LABEL[k]).join(";")].concat(books().map(b=>ks.map(k=>`"${(b[k]||"").toString().replace(/"/g,'""')}"`).join(";")));copy(rows.join("\n"),"Copié – colle dans Excel")}
function importForm(){openSheet(`<h2>Importer</h2><div class="sub">Colle une liste JSON exportée depuis cette appli (ou depuis la version Claude). Les livres existants (même identifiant) seront mis à jour, et ceux absents de la liste seront retirés.</div><textarea class="f" id="impt"></textarea><div class="row"><button class="btn" id="cancel">Annuler</button><button class="btn primary" id="doimp">Importer</button></div>`);
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("doimp").onclick=()=>{try{const arr=JSON.parse(document.getElementById("impt").value);if(!Array.isArray(arr))throw 0;
    const next={},seen=new Set();let n=0;
    for(const b of arr){if(!b||!b.titre)continue;const id=b.id||("u"+Date.now().toString(36)+n);const {id:_,...rest}=b;next[id]=rest;seen.add(id);n++}
    for(const b of BASE) if(!seen.has(b.id)) next[b.id]={deleted:true};
    overrides=next;lsSet();render();closeSheet();toast(n+" livres importés")}catch(e){toast("JSON invalide")}}}

let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2000)}

// ---- events
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-dim],[data-k],[data-id],[data-edit],[data-del],#clearf,#exp,#imp,#csv");if(!t)return;
  if(t.dataset.dim){state.dim=t.dataset.dim;state.filter=null;render();window.scrollTo(0,0)}
  else if(t.dataset.k){e.preventDefault();state.filter={k:t.dataset.k,v:t.dataset.v};state.q="";document.getElementById("q").value="";closeSheet();render();window.scrollTo(0,0)}
  else if(t.dataset.id)detail(t.dataset.id);
  else if(t.dataset.edit)editForm(t.dataset.edit);
  else if(t.dataset.del)confirmDel(t.dataset.del);
  else if(t.id==="clearf"){state.filter=null;render()}
  else if(t.id==="exp")exportJSON();else if(t.id==="imp")importForm();else if(t.id==="csv")exportCSV();
});
document.addEventListener("change",e=>{if(e.target.id==="sort"){state.sort=e.target.value;render()}});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render()});
document.getElementById("add").onclick=()=>editForm(null);
render();

// ---- PWA : fonctionnement hors ligne
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
